# SonarCloud analysis configuration for SecureTrace.
#
# SonarCloud's secret-detection rule (secrets:S6334) flags the sample tokens
# that live inside vendored *scanner rule-definition* files — those tokens are
# illustrative examples from the tool's own default rule set, not live
# credentials. gitleaks' own repository allowlists its own config for exactly
# this reason (see .gitleaks.toml and LESSONS_LEARNED.md LLT-0008).
#
# Excluding the vendored rule set from analysis is the durable fix; the 16
# resulting findings on .gitleaks-defaults.toml (lines 619-634) were also
# triaged to "false positive" with justification comments on 2026-10-18.
sonar.exclusions=.gitleaks-defaults.toml
# Explicit test-file classification (SonarPython): without this, files that
# look like tests are only heuristically classified, and SonarPython warns
# that production-code rules were not executed on them. Setting it makes the
# classification explicit so test rules apply and the warning disappears.
sonar.tests=tests
