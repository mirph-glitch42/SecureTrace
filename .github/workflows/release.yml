name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  build-and-release:
    name: gate, package, sign-ready, publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pinned dependencies
        run: make setup-ci

      - name: Full local gate (mirror of CI quality job)
        run: make gate

      - name: Package (sdist + wheel)
        run: make package

      - name: Generate SBOM
        run: make sbom

      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: securetrace-release
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/sbom.json
          retention-days: 365

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "SecureTrace ${GITHUB_REF_NAME}" \
            --notes "Automated release from main. Artifacts: sdist, wheel, CycloneDX SBOM (see release assets)." \
            --verify
