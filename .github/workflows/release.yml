name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write # covers read; a scope may only appear once in a mapping

env:
  PYTHONUNBUFFERED: "1"

jobs:
  build-and-release:
    name: gate, package, sign, attest, verify, publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install pinned dependencies
        run: make setup-ci

      - name: Full local gate (mirror of CI quality job)
        run: make gate

      - name: Package (sdist + wheel)
        run: make package

      - name: Generate SBOM
        run: make sbom

      # --- B5: keyless signing + provenance (ARCHITECTURE.md Section 5) ------
      # Install cosign from a SHA-pinned installer (v4.1.2) with a pinned
      # cosign version (v2.6.5). The installer independently verifies the
      # cosign binary against the Sigstore release public key before use.
      - name: Install cosign (pinned installer + pinned version)
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v2.6.5"

      # Keyless (Fulcio OIDC) signatures; the signed bundle is emitted next to
      # each artifact as <artifact>.sigstore.json.
      - name: Sign artifacts (keyless, Sigstore)
        run: |
          set -euo pipefail
          for f in dist/*.whl dist/*.tar.gz; do
            cosign sign-blob "$f" --bundle "${f}.sigstore.json" --yes
          done

      # GitHub-native SLSA v1 provenance attestation (free for public repos):
      # one signed attestation covering both artifacts, stored in the GitHub
      # attestation registry (keyed by digest) and also saved locally.
      - name: Attest provenance (SLSA v1, actions/attest)
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz

      - name: Publish attestation bundle alongside artifacts
        run: cp "${{ steps.attest.outputs.bundle-path }}" dist/attestation-bundle.json

      # Fail fast BEFORE any release is created: the signing certificate must
      # be bound to exactly this workflow file on exactly this tag.
      - name: Verify signatures (identity-pinned to this workflow + tag)
        run: |
          set -euo pipefail
          for f in dist/*.whl dist/*.tar.gz; do
            cosign verify-blob "$f" \
              --bundle "${f}.sigstore.json" \
              --certificate-identity "https://github.com/mirph-glitch42/SecureTrace/.github/workflows/release.yml@refs/tags/${GITHUB_REF_NAME}" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
          done

      # ...and the provenance attestation must be signed by exactly this
      # workflow (fully anchored SAN match, gh CLI policy). Online lookup by
      # artifact digest in the GitHub attestation registry.
      - name: Verify provenance (SLSA v1, signer-workflow pinned)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for f in dist/*.whl dist/*.tar.gz; do
            gh attestation verify "$f" \
              -R mirph-glitch42/SecureTrace \
              --signer-workflow "mirph-glitch42/SecureTrace/.github/workflows/release.yml"
          done
      # --------------------------------------------------------------------------

      - name: Upload release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: securetrace-release
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/sbom.json
            dist/*.sigstore.json
            dist/attestation-bundle.json
          retention-days: 365

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Idempotent re-publish: a workflow rerun (or tag re-push) for the
          # same tag must replace, not conflict with, the previous release.
          # Deleting a release is allowed even for immutable releases (it is
          # the assets of an existing release that cannot be modified).
          gh release delete "${GITHUB_REF_NAME}" --yes >/dev/null 2>&1 || true
          gh release create "${GITHUB_REF_NAME}" \
            --title "SecureTrace ${GITHUB_REF_NAME}" \
            --notes "Automated immutable release. Assets: sdist, wheel, CycloneDX SBOM, Sigstore keyless signature bundles, SLSA v1 provenance attestation bundle. Consumer verification: gh release verify / gh release verify-asset; full recipe in ARCHITECTURE.md Section 5." \
            --prerelease \
            --verify-tag \
            dist/*.whl \
            dist/*.tar.gz \
            dist/sbom.json \
            dist/*.sigstore.json \
            dist/attestation-bundle.json

      # Consumer-side proof, run as a real consumer would (in-pipeline):
      # the release carries a valid signed release attestation and every
      # locally built artifact exactly matches the published release assets.
      #
      # GitHub creates that release attestation (initiator "github", subject
      # = the tag ref, predicate type "release") ASYNCHRONOUSLY after the
      # release is published. A verify issued within about one second of
      # `gh release create` can miss it ("no attestations for tag <tag>")
      # even though everything is valid - observed 2026-10-19, run
      # 39245874727 (verify at +0.4s failed; the attestation was queryable
      # minutes later). Retry with backoff instead of failing on delay.
      - name: Verify published release (consumer-side proof)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          max_attempts=10
          attempt=1
          while :; do
            ok=1
            gh release verify "${GITHUB_REF_NAME}" || ok=0
            if [ "$ok" -eq 1 ]; then
              for f in dist/*.whl dist/*.tar.gz; do
                gh release verify-asset "${GITHUB_REF_NAME}" "$f" || ok=0
              done
            fi
            if [ "$ok" -eq 1 ]; then
              echo "Consumer-side verification passed on attempt ${attempt}/${max_attempts}."
              exit 0
            fi
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "ERROR: release attestation not visible after ${max_attempts} attempts (~5 min)." >&2
              exit 1
            fi
            echo "Release attestation not yet visible (attempt ${attempt}/${max_attempts}); retrying in 30s..." >&2
            attempt=$((attempt + 1))
            sleep 30
          done
